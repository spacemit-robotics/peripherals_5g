module: components/peripherals/5g

tests:
  - name: 5g-api-functional
    description: Verifies modem lifecycle, info, PDP, data state, events, and AT passthrough using a mock UART modem.
    category: functional
    scopes: [pr, scheduled]
    timeout_s: 120
    workdir: sdk
    command: |
      bash components/peripherals/5g/tests/test_5g_api_contract.sh functional

  - name: 5g-api-error-paths
    description: Verifies invalid arguments, missing drivers, bad AT commands, bad PDP IDs, and operations before init.
    category: functional
    scopes: [pr, scheduled]
    timeout_s: 120
    workdir: sdk
    command: |
      bash components/peripherals/5g/tests/test_5g_api_contract.sh error-paths

  - name: 5g-mr880a-hardware-smoke
    description: Manually verifies the MR880A UART modem can answer real hardware info, SIM, registration, or signal queries.
    category: functional
    scopes: [manual]
    timeout_s: 180
    workdir: sdk
    requires:
      hardware:
        - MR880A 5G modem connected to MODEM_5G_UART_DEV, or auto-detect support.
      supervision: true
    command: |
      bash components/peripherals/5g/tests/test_hw_mr880a_smoke.sh
